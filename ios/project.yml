name: CobrainBoard
options:
  bundleIdPrefix: com.cobrain
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  CobrainBoard:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../macos/Sources/Cobrain/Board
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cobrain.board
        PRODUCT_NAME: Cobrain Board
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Cobrain Board
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        CODE_SIGN_STYLE: Automatic
    info:
      path: Info.plist
      properties:
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Cobrain Whiteboard
            LSHandlerRank: Owner
            LSItemContentTypes: [com.cobrain.board]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.cobrain.board
            UTTypeDescription: Cobrain Whiteboard
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [cobrainboard]
